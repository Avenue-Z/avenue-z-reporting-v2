# Raw response of GET /classifications/domains and GET /classifications/urls (live OpenAPI, 2026-11-09).
# A custom classification is referenced by NAME in the domain_classification / url_classification filters.
schema: peec.classifications_response
version: 1.0.0
kind: payload
json_schema:
  type: object
  required: [data]
  properties:
    data:
      type: array
      items:
        type: object
        required: [name, color]
        properties:
          name: {type: string, minLength: 1}
          color: {type: string}
