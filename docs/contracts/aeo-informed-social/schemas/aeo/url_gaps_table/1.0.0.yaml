# GapRow (tables.ts). citationShare is a row's citations over the sum across every row of the same pull. citationPosition is null when no chat cited the URL inline.
schema: aeo.url_gaps_table
version: 1.0.0
kind: tabular
fields:
  - {name: rank, type: int, minimum: 1}
  - {name: url, type: string, min_length: 1}
  - {name: title, type: string, nullable: true}
  - {name: channelTitle, type: string, nullable: true}
  - {name: urlType, type: string, nullable: true}
  - {name: domainType, type: string, min_length: 1}
  - {name: mentionedBrandCount, type: int, minimum: 0}
  - {name: mentionedBrandNames, type: string, nullable: true}
  - {name: citationShare, type: float, minimum: 0.0, maximum: 1.0}
  - {name: citationPosition, type: float, nullable: true, minimum: 1}
  - {name: retrievals, type: int, minimum: 0}
  - {name: retrievalsDelta, type: int, nullable: true}
  - {name: totalCitations, type: int, minimum: 0}
  - {name: totalCitationsDelta, type: int, nullable: true}
