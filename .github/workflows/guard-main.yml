name: Guard main merges

# Enforces the promotion flow: dev -> staging -> main. Any pull request targeting
# `main` must originate from `staging`. Make this a REQUIRED status check in main's
# ruleset so a failing (or missing) run blocks the merge.
on:
  pull_request:
    branches: [main]

jobs:
  require-from-staging:
    runs-on: ubuntu-latest
    steps:
      - name: Require the PR to come from staging
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "$HEAD_REF" != "staging" ]; then
            echo "::error::PRs into 'main' must come from 'staging' (this PR is from '$HEAD_REF'). Promote your work dev -> staging first, then open a staging -> main PR."
            exit 1
          fi
          echo "OK — PR is from 'staging'."
