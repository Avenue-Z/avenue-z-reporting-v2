name: Guard migration ordering

# Stops a schema change from reaching a branch whose database has not been
# migrated to match it — and stops a destructive migration from being applied
# under code that still reads what it drops. The mechanism, the two labels, and
# why a migrator's exit code proves nothing are documented at the top of
# .github/scripts/guard-migration-ordering.sh.
#
# ENFORCEMENT (keep this accurate — a gate nobody wired up is worse than none):
#   staging, main : required status check, enforced by the branch rulesets.
#   dev           : advisory only. `dev` has no ruleset, so a red run here does
#                   not block the merge button; someone has to look. Ungated on
#                   the branch where the outage lands first, which is a known gap.
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  require-migration-applied:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # When each label was applied, so the guard can reject one that predates the
      # current head commit. The PR payload carries which labels are on the PR but
      # not when they landed, and GitHub never strips a label on push.
      - name: Collect label timeline
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          events=$(gh api --paginate "repos/${REPO}/issues/${PR}/timeline" \
            --jq '.[] | select(.event == "labeled") | {label: .label.name, at: .created_at}' \
            | jq -sc '.')
          echo "events=${events}" >> "$GITHUB_OUTPUT"

      - name: Require the migration ordering to have been confirmed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABEL_EVENTS: ${{ steps.labels.outputs.events }}
        run: .github/scripts/guard-migration-ordering.sh
